services:
  - type: web
    name: talentsync-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_PROCESSING_MODE
        value: assessment
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_SERVICE_TIER
        value: unpaid
      - key: GEMINI_TIMEOUT_MS
        value: 30000
      - key: FRONTEND_URL
        value: https://talentsync-ai-chi.vercel.app
